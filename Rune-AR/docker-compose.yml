services:
  db:
    image: postgres:15-alpine
    container_name: rune-postgres
    network_mode: host
    environment:
      POSTGRES_USER: rune_pg_user
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: runedb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rune_pg_user -d runedb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (Flask App)
  backend:
    build:
      context: ./back-end/server
      dockerfile: Dockerfile.dev
    container_name: flask_backend_dev
    network_mode: host
    volumes:
      - ./back-end/server:/app
    environment:
      - DATABASE_URL=postgresql://rune_pg_user:securepassword123@127.0.0.1:5432/runedb
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_api_key_here}
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (React App)
  frontend:
    build:
      context: ./front-end/helix
      dockerfile: Dockerfile.dev
    container_name: react_frontend_dev
    network_mode: host
    volumes:
      - ./front-end/helix:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_BASE_URL=http://127.0.0.1:5001
    depends_on:
      - backend

volumes:
  pgdata:
